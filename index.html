<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Our Beloved Feline Family 🐾</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #fdf6ec; --warm: #e8d5b7; --gold: #c9a84c; --dark: #2c1f0e;
    --brown: #6b4226; --muted: #9a7a5a; --deceased: #8a8a8a;
    --honorary: #4a7c6f; --missing: #b07d3a; --adopted: #6a5acd;
    --photo: 100px;
  }
  body { background: var(--cream); font-family: 'Lato', sans-serif; color: var(--dark); min-height: 100vh; overflow-x: hidden; }

  header { text-align: center; padding: 48px 20px 28px; }
  header::after { content:''; display:block; width:160px; height:2px; background:linear-gradient(to right,transparent,var(--gold),transparent); margin:14px auto 0; }
  h1 { font-family:'Playfair Display',serif; font-size:clamp(1.7rem,6vw,2.8rem); color:var(--brown); line-height:1.2; }
  h1 span { font-style:italic; color:var(--gold); }
  .subtitle { font-size:0.78rem; color:var(--muted); margin-top:6px; letter-spacing:0.12em; text-transform:uppercase; }

  .tree { max-width:960px; margin:0 auto; padding:10px 12px 60px; }

  .section-label { text-align:center; font-family:'Playfair Display',serif; font-size:0.95rem; color:var(--muted); letter-spacing:0.15em; text-transform:uppercase; margin:36px 0 18px; }
  .section-label::before,.section-label::after { content:'✦'; margin:0 10px; font-size:0.65rem; vertical-align:middle; color:var(--gold); }

  /* card */
  .card { display:flex; flex-direction:column; align-items:center; width:110px; cursor:pointer; transition:transform 0.22s; flex-shrink:0; }
  .card:hover { transform:translateY(-5px); }
  .card.static { cursor:default; }
  .card.static:hover { transform:none; }

  .frame {
    width:var(--photo); height:var(--photo); border-radius:50%;
    border:3px solid var(--gold); overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,0.13);
    position:relative; background:var(--warm);
    display:flex; align-items:center; justify-content:center;
    transition:box-shadow 0.22s; flex-shrink:0;
  }
  .card:hover .frame { box-shadow:0 10px 28px rgba(201,168,76,0.32); }
  .frame img { width:100%; height:100%; object-fit:cover; object-position:center top; }
  .frame.dec { border-color:var(--deceased); filter:grayscale(0.6); }
  .frame.hon { border-color:var(--honorary); border-style:dashed; }
  .frame.unk { border-color:var(--muted); border-style:dashed; background:rgba(154,122,90,0.08); }
  .frame.miss { border-color:var(--missing); border-style:dotted; background:rgba(176,125,58,0.07); }
  .frame.dec-unk { border-color:var(--deceased); border-style:dashed; background:rgba(138,138,138,0.09); filter:grayscale(0.4); }
  .frame.adopted { border-color:var(--adopted); border-style:dashed; background:rgba(106,90,205,0.07); }

  .icon { font-size:1.8rem; color:var(--muted); opacity:0.45; }
  .badge {
    position:absolute; bottom:5px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:0.42rem; letter-spacing:0.08em; text-transform:uppercase;
    padding:2px 5px; border-radius:8px; white-space:nowrap;
  }
  .badge.dec { background:rgba(0,0,0,0.55); }
  .badge.miss { background:rgba(176,125,58,0.75); }
  .badge.adopted { background:rgba(106,90,205,0.75); }

  .name { font-family:'Playfair Display',serif; font-size:0.8rem; font-weight:700; margin-top:8px; color:var(--brown); text-align:center; }
  .role { font-size:0.58rem; color:var(--muted); text-align:center; letter-spacing:0.07em; text-transform:uppercase; margin-top:2px; line-height:1.4; }
  .role.hon { color:var(--honorary); }
  .diff-tag { font-size:0.52rem; color:var(--muted); margin-top:4px; border:1px dashed var(--muted); border-radius:8px; padding:1px 6px; opacity:0.75; text-align:center; }

  /* lines */
  .vl { width:2px; background:var(--gold); opacity:0.4; margin:0 auto; }
  .hl { height:2px; background:var(--gold); opacity:0.4; }
  .heart { font-size:0.85rem; color:var(--gold); opacity:0.7; padding:0 3px; }

  .col { display:flex; flex-direction:column; align-items:center; }
  .row { display:flex; justify-content:center; align-items:flex-start; flex-wrap:wrap; gap:12px; }
  .couple { display:flex; align-items:flex-end; justify-content:center; flex-wrap:wrap; gap:0; }
  .cpcon { display:flex; align-items:center; padding-bottom:50px; }

  .divider { width:80%; height:1px; background:linear-gradient(to right,transparent,var(--warm),transparent); margin:44px auto; }

  /* legend */
  .legend { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin:44px auto 0; padding:16px 12px; max-width:680px; border-top:1px solid var(--warm); }
  .legend-item { display:flex; align-items:center; gap:6px; font-size:0.68rem; color:var(--muted); }
  .ldot { width:13px; height:13px; border-radius:50%; border:2px solid; flex-shrink:0; }
  .ldot.n { border-color:var(--gold); }
  .ldot.d { border-color:var(--deceased); border-style:dashed; }
  .ldot.h { border-color:var(--honorary); border-style:dashed; }
  .ldot.m { border-color:var(--missing); border-style:dotted; }
  .ldot.u { border-color:var(--muted); border-style:dashed; }
  .ldot.a { border-color:var(--adopted); border-style:dashed; }

  /* modal */
  .overlay { display:none; position:fixed; inset:0; background:rgba(44,31,14,0.72); backdrop-filter:blur(4px); z-index:100; justify-content:center; align-items:center; padding:16px; }
  .overlay.open { display:flex; }
  .modal { background:var(--cream); border:2px solid var(--gold); border-radius:16px; padding:26px 22px; max-width:340px; width:100%; text-align:center; position:relative; box-shadow:0 20px 50px rgba(0,0,0,0.28); animation:popIn 0.28s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes popIn { from{transform:scale(0.82);opacity:0;} to{transform:scale(1);opacity:1;} }
  .modal img { width:130px; height:130px; border-radius:50%; object-fit:cover; object-position:center top; border:3px solid var(--gold); margin-bottom:12px; }
  .modal img.dec { filter:grayscale(0.6); border-color:var(--deceased); }
  .modal h2 { font-family:'Playfair Display',serif; font-size:1.45rem; color:var(--brown); }
  .modal p { font-size:0.8rem; color:var(--muted); margin-top:6px; line-height:1.6; }
  .mclose { position:absolute; top:10px; right:14px; background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--muted); padding:4px; }

  @media(max-width:480px){
    :root { --photo:78px; }
    .card { width:88px; }
    .name { font-size:0.7rem; }
    .role { font-size:0.52rem; }
    .cpcon { padding-bottom:44px; }
    .modal img { width:110px; height:110px; }
  }
</style>
</head>
